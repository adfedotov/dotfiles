general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(d8dee9ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(8a91a5ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    rounding = 0
    outline_thickness = 2
    outer_color = rgba(88c0d0ff)
    inner_color = rgba(14141ae6)
    font_color = rgba(d8dee9ff)
    check_color = rgba(ebcb8bff)
    fail_color = rgba(bf616aff)
    fade_on_empty = false
    placeholder_text = <span foreground="##8a91a5">password</span>
    fail_text = <i>wrong password</i>
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}
