# Pantheon SDDM theme — defaults (equal to the "bright" preset).
# Don't edit per host: install.sh writes theme.conf.user, which SDDM layers on top.
[General]
# set by install.sh (wallpaper copied next to this file)
background=background.png

# 0 = untouched, 1 = black
dim=0.45
# 0 = sharp, 1 = max blur (whole wallpaper)
blur=0.0
accent=#88c0d0
# must be a system-wide font (SDDM can't read ~/.local/share/fonts)
font=JetBrainsMono Nerd Font
# which monitor shows the login form: largest | all | primary
formScreen=largest

# frosted card behind the login form
card=true
cardTint=#1c1f29
cardOpacity=0.35
cardBorder=0.10
cardBlur=0.8
# soft shadow under the clock
textShadow=true

# preview helper: saves <path>-<width>.png ~1.5s after load (leave empty)
screenshot=
