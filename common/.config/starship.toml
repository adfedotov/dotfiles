add_newline = true

[character]
success_symbol = '[❯](#88c0d0)'
error_symbol = '[❯](#bf616a)'

[directory]
style = 'bold #81a1c1'

[git_branch]
symbol = " "
style = 'bold #b48ead'

[git_status]
style = '#ebcb8b'
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
style = '#6c7386'

[gcloud]
disabled = true
