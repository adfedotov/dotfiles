# Font (same as waybar; also gives starship its git icon)
font_family JetBrainsMono Nerd Font
font_size 9

# Nord-ish base colors only; ANSI palette left at defaults
foreground #d8dee9
background #2e3440
cursor #d8dee9
selection_foreground #2e3440
selection_background #88c0d0
url_color #88c0d0

# Transparency
background_opacity 0.93

# No breathing room
window_padding_width 0

# Shell
shell /usr/bin/zsh

# Copy/paste without Shift
# ctrl+c copies if there's a selection, otherwise sends SIGINT as usual
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
# Mouse: select to copy to primary clipboard (default); middle-click pastes
copy_on_select clipboard
